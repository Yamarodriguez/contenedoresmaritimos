<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Contenedores Marítimos">
  <defs>
    <clipPath id="globo"><circle cx="48" cy="48" r="44"/></clipPath>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1561a8"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
  </defs>
  <!-- Globo -->
  <circle cx="48" cy="48" r="44" fill="url(#mar)"/>
  <g clip-path="url(#globo)" fill="none" stroke="#8fc2ee" stroke-width="1.6" opacity="0.55">
    <ellipse cx="48" cy="48" rx="19" ry="44"/>
    <ellipse cx="48" cy="48" rx="38" ry="44"/>
    <line x1="48" y1="4" x2="48" y2="92"/>
    <path d="M6 34 Q48 44 90 34"/>
    <path d="M6 62 Q48 72 90 62"/>
    <line x1="4" y1="48" x2="92" y2="48"/>
  </g>
  <!-- Contenedor (amarillo de la raya del logo) -->
  <g>
    <polygon points="22,45 33,35 79,35 68,45" fill="#ffe27a"/>
    <polygon points="68,45 79,35 79,63 68,73" fill="#c99a00"/>
    <rect x="22" y="45" width="46" height="28" rx="1.5" fill="#f2c200"/>
    <g stroke="#c99a00" stroke-width="1.6" stroke-linecap="round">
      <line x1="29" y1="49" x2="29" y2="69"/>
      <line x1="35" y1="49" x2="35" y2="69"/>
      <line x1="41" y1="49" x2="41" y2="69"/>
      <line x1="47" y1="49" x2="47" y2="69"/>
      <line x1="53" y1="49" x2="53" y2="69"/>
      <line x1="59" y1="49" x2="59" y2="69"/>
    </g>
    <rect x="22" y="45" width="46" height="28" rx="1.5" fill="none" stroke="#0b2a4a" stroke-width="2"/>
  </g>
  <!-- Órbita: la raya amarilla del logo original, ahora alrededor del globo -->
  <path d="M6 62 C 30 86, 74 88, 92 58" fill="none" stroke="#f2c200" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#0b2a4a" stroke-width="2"/>
</svg>
